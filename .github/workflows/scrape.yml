name: Apartment Scraper

on:
  schedule:
    # Run every 5 minutes (GitHub may aggregate; adjust if needed)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_DELAY: ${{ secrets.TELEGRAM_DELAY || '0.5' }}
      FILTER_MAX_PRICE: ${{ secrets.FILTER_MAX_PRICE || '2000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run scraper
        run: python scraper.py
