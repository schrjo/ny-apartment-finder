name: Apartment Scraper

on:
  schedule:
    # Run every 5 minutes (GitHub may aggregate; adjust if needed)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SEEN_CACHE_PREFIX: seen-state-${{ github.ref_name }}-
      SEEN_CACHE_KEY: seen-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_DELAY: ${{ secrets.TELEGRAM_DELAY || '0.5' }}
      FILTER_MAX_PRICE: ${{ secrets.FILTER_MAX_PRICE || '2000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Ensure data directory
        run: mkdir -p data

      - name: Restore seen state cache
        id: restore-seen-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/seen.json
            data/seen_meta.json
          key: ${{ env.SEEN_CACHE_KEY }}
          restore-keys: |
            ${{ env.SEEN_CACHE_PREFIX }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run scraper
        run: python scraper.py

      - name: Save seen state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/seen.json
            data/seen_meta.json
          key: ${{ env.SEEN_CACHE_KEY }}
